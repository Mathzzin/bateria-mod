plugins { id 'eclipse'; id 'idea'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }

version = '1.0.0'
group = 'br.com.bateriamod'
archivesBaseName = 'bateriamod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { bateriamod { source sourceSets.main } } }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.20.1', minecraft_version_range: '[1.20.1,1.21)', forge_version: '47.2.0', forge_version_range: '[47,)', loader_version_range: '[47,)', mod_id: 'bateriamod', mod_name: 'Bateria Mod', mod_license: 'MIT', mod_version: project.version, mod_authors: 'Criado com ajuda do ChatGPT', mod_description: 'Adicione uma bateria musical jogável e baquetas ao Minecraft.' ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}
